name: daily-run

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the report by email after a manual run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: Run offline tests
        run: |
          python index_score.py --selftest
          python -m unittest discover -s tests -v

      - name: 生成评分报告
        run: python index_score.py

      - name: Stage report
        run: |
          mkdir -p _site
          cp index.html result.html result.json _site/

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: 提交产物到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.html result.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "daily update $(date +%F)"
            git push
          fi
  deploy:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  notify:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' && (github.event_name == 'schedule' || inputs.send_email) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report
          path: .

      - name: 发送邮件通知
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PWD }}
          subject: 【美股每日评分】纳斯达克100 & 标普500
          body: 每日美股指数评分报告已生成，邮件内嵌展示，附件含 result.html / result.json，网页版：https://blog.950922.xyz/us-index-score/result.html
          html_body: file://result.html
          to: ${{ secrets.MAIL_USER }}
          from: 美股评分机器人 <${{ secrets.MAIL_USER }}>
          secure: true
          attachments: result.html,result.json
